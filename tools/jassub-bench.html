<!doctype html>
<meta charset="utf-8"><base href="/">
<style>html,body{margin:0;width:100%;height:100%;background:#101820;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}</style>
<canvas id="subs"></canvas>
<script type="module">
import { initAssCanvasRenderer, setAssFontScale, disposeAssRenderer } from '../src/utils/assRenderer.js'
import { waitForAssReady } from '../src/utils/assRendererReady.js'

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
const q = new URLSearchParams(location.search)
const scenario = q.get('scenario') || 'static'
const width = Number(q.get('width') || 1920)
const height = Number(q.get('height') || 1080)
const frames = Number(q.get('frames') || 40)
const renderScale = Number(q.get('renderScale') || 1)
const adaptive = q.get('adaptive') === '1'
const normalWasm = q.get('normalWasm') === '1'
const storageW = Number(q.get('storageW') || 0)
const storageH = Number(q.get('storageH') || 0)
const keep = q.get('keep') === '1'

window.__errors = []
window.addEventListener('error', (event) => window.__errors.push(String(event.message || event.error)))
window.addEventListener('unhandledrejection', (event) => window.__errors.push(String(event.reason?.message || event.reason)))

const header = `[Script Info]
ScriptType: v4.00+
PlayResX: 1920
PlayResY: 1080
WrapStyle: 0
ScaledBorderAndShadow: yes

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Roboto,54,&H00FFFFFF,&H000000FF,&H00102040,&H80000000,-1,0,0,0,100,100,0,0,1,2,1,2,30,30,36,1
Style: Sign,Roboto,34,&H0000FFFF,&H000000FF,&H00202020,&H80000000,0,0,0,0,100,100,0,0,1,1.5,1,8,20,20,20,1

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
`
const at = (frames) => `0:00:${String(Math.floor(frames / 100)).padStart(2, '0')}.${String(frames % 100).padStart(2, '0')}`
const dialogue = (text, style = 'Default', layer = 0, start = 0, end = 600) => `Dialogue: ${layer},${at(start)},${at(end)},${style},,0,0,0,,${text}`
const syllable = (i) => `{\\kf18}sy${i % 10}`
const scenarios = {
  static: [
    dialogue('Plain dialogue line for a baseline'),
    dialogue('{\\pos(960,80)}Simple positioned sign', 'Sign', 1),
  ],
  unicode: [
    dialogue('Symbols ♪ ♥ ★ → and Arabic مرحبا بالعالم'),
    dialogue('Hebrew שלום עולם and Thai สวัสดีชาวโลก'),
  ],
  karaoke: [
    dialogue(Array.from({ length: 70 }, (_, i) => syllable(i)).join('')),
    dialogue('{\\pos(960,80)}Karaoke stress', 'Sign', 1),
  ],
  blur: Array.from({ length: 8 }, (_, i) =>
    dialogue(`{\\pos(${260 + i * 200},${180 + (i % 4) * 180})\\blur2.4\\bord4\\shad3\\frz${i * 7}}heavy blur ${i}`, 'Sign', i)
  ),
  vector: Array.from({ length: 8 }, (_, i) =>
    dialogue(`{\\pos(${300 + i * 180},${260 + (i % 3) * 220})\\p1\\bord0\\c&H00D0FFFF&\\frz${i * 9}}m 0 0 l 160 0 160 110 0 110 x 0 0 m 20 20 l 140 20 140 90 20 90`, 'Sign', i)
  ),
  signs: Array.from({ length: 24 }, (_, i) =>
    dialogue(`{\\pos(${120 + (i % 6) * 330},${90 + Math.floor(i / 6) * 230})\\frz${(i % 7) * 6}\\fscx${105 + (i % 4) * 12}\\fscy${105 + (i % 3) * 10}}sign ${i}`, 'Sign', i)
  ),
  anime: [
    dialogue(`{\\move(360,850,1560,850)\\frz8\\t(0,1800,\\frz-8)}motion rotation`),
    dialogue(Array.from({ length: 45 }, (_, i) => syllable(i)).join('')),
    ...Array.from({ length: 6 }, (_, i) => dialogue(`{\\pos(${280 + i * 260},${170 + (i % 2) * 120})\\blur1.8\\bord3\\p1\\c&H00C0F0F0&}m 0 0 l 180 0 150 90 30 90`, 'Sign', 2 + i)),
  ],
  extreme: [
    dialogue(Array.from({ length: 100 }, (_, i) => syllable(i)).join('')),
    dialogue(`{\\move(240,900,1680,900)\\frz12\\t(0,2400,\\frz-12\\fscx115\\fscy115)}extreme motion`),
    ...Array.from({ length: 48 }, (_, i) => dialogue(`{\\pos(${70 + (i % 8) * 250},${80 + Math.floor(i / 8) * 150})\\blur1.5\\bord2\\shad2\\frz${(i % 12) * 8}\\p1\\c&H00C0F0F0&}m 0 0 l 120 0 l 100 70 l 20 70 x 0 0 m 15 12 l 105 12 l 92 58 l 28 58`, 'Sign', 2 + i)),
    ...Array.from({ length: 24 }, (_, i) => dialogue(`{\\pos(${110 + (i % 6) * 330},${120 + Math.floor(i / 6) * 220})\\frz${(i % 8) * 9}\\fscx${110 + (i % 5) * 10}\\fscy${110 + (i % 4) * 8}\\blur0.8\\t(0,1800,\\frz${(i % 8) * 9 + 40})}particle ${i}`, 'Sign', 60 + i)),
  ],
}
const ass = header + scenarios[scenario].join('\n')

const alphaCount = async (renderer, time) => {
  const capture = await renderer.instance.renderer._drawCapture(time)
  let alpha = 0
  for (let i = 3; i < capture.data.length; i += 4) if (capture.data[i]) alpha++
  return { alpha, width: capture.width, height: capture.height }
}

const capturePng = async (renderer, time) => {
  const capture = await renderer.instance.renderer._drawCapture(time)
  const canvas = document.createElement('canvas')
  canvas.width = capture.width
  canvas.height = capture.height
  canvas.getContext('2d').putImageData(new ImageData(capture.data, capture.width, capture.height), 0, 0)
  return canvas.toDataURL('image/png')
}

const percentile = (values, p) => values[Math.min(values.length - 1, Math.floor(values.length * p))]
const summarize = (values) => {
  const sorted = [...values].sort((a, b) => a - b)
  return {
    avg: +(values.reduce((sum, value) => sum + value, 0) / values.length).toFixed(2),
    p50: +percentile(sorted, 0.5).toFixed(2),
    p90: +percentile(sorted, 0.9).toFixed(2),
    max: +sorted[sorted.length - 1].toFixed(2),
  }
}

let assUrl = null
const start = async () => {
  const canvas = document.getElementById('subs')
  const url = assUrl ||= URL.createObjectURL(new Blob([ass], { type: 'text/plain' }))
  const validate = WebAssembly.validate
  if (normalWasm) WebAssembly.validate = () => false
  const renderer = await initAssCanvasRenderer(canvas, url, [], (error) => window.__errors.push(`engine:${error?.message || error}`), false, storageW && storageH ? { width: storageW, height: storageH } : null)
  WebAssembly.validate = validate
  if (!renderer) throw new Error('no renderer')
  window.__renderer = renderer
  await renderer.ready
  await renderer.resize(width, height)
  if (renderScale !== 1) await renderer.instance.renderer._resizeCanvas(Math.round(width * renderScale), Math.round(height * renderScale), 0, 0)
  renderer.setIsPaused(true, 1.5)
  await sleep(250)
  window.__assUrl = url
  return renderer
}

const domAlpha = (canvas) => {
  const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data
  let alpha = 0
  for (let i = 3; i < data.length; i += 4) if (data[i]) alpha++
  return { alpha, width: canvas.width, height: canvas.height }
}

const benchOctopus = async (renderer) => {
  await waitForAssReady(renderer, 5000)
  renderer.resize(width, height)
  renderer.setIsPaused(true, 1.5)
  renderer.setCurrentTime(1.5)
  await sleep(800)
  const capture = domAlpha(renderer.canvas)
  window.__scenarioShot = renderer.canvas.toDataURL('image/png')
  renderer.setCurrentTime(8)
  await sleep(350)
  const afterEnd = domAlpha(renderer.canvas)
  renderer.setCurrentTime(1.5)
  await sleep(350)
  const seekBack = domAlpha(renderer.canvas)
  renderer.resize(1280, 720)
  renderer.setCurrentTime(1.5)
  await sleep(350)
  const resized = domAlpha(renderer.canvas)
  renderer.setIsPaused(false, 0.8)
  await sleep(700)
  renderer.setIsPaused(true, 1.5)
  if (!keep) disposeAssRenderer(renderer)
  return { scenario, width, height, engine: 'octopus', capture, drawDebug: null, afterEnd, seekBack, resized, playback: { errors: window.__errors.length }, errors: window.__errors }
}

const bench = async () => {
  const renderer = await start()
  if (!renderer.instance) return benchOctopus(renderer)
  const forced = []
  const natural = []
  for (let i = 0; i < frames; i++) {
    const time = 0.8 + i * 0.045
    const started = performance.now()
    await renderer.instance.renderer._draw(time, true)
    forced.push(performance.now() - started)
  }
  for (let i = 0; i < frames; i++) {
    const time = 3.2 + i * 0.045
    const started = performance.now()
    await renderer.instance.renderer._draw(time, false)
    natural.push(performance.now() - started)
  }
  let adaptiveResult = null
  if (adaptive) {
    const costs = []
    for (let i = 0; i < 15; i++) {
      renderer.anchor(4.2 + i * 0.045)
      const started = performance.now()
      await renderer.render(true)
      costs.push(Math.round((performance.now() - started) * 10) / 10)
    }
    adaptiveResult = { qualityLevel: renderer.qualityLevel, size: renderer.renderSize(), costs }
  }

  const capture = await alphaCount(renderer, 1.5)
  window.__scenarioShot = await capturePng(renderer, 1.5)
  const rawDebug = renderer.instance.renderer._drawDebug ? await renderer.instance.renderer._drawDebug(1.5) : null
  const drawDebug = rawDebug ? JSON.parse(rawDebug) : null
  const afterEnd = await alphaCount(renderer, 8)
  const seekBack = await alphaCount(renderer, 1.5)
  await renderer.resize(1280, 720)
  const resized = await alphaCount(renderer, 1.5)
  await renderer.resize(width, height)
  setAssFontScale(renderer, 1.25)
  await sleep(250)
  const scaled = await alphaCount(renderer, 1.5)

  const trackNames = ['static', 'anime', 'signs']
  const trackSwitch = []
  for (const name of trackNames) {
    const started = performance.now()
    await renderer.setTrack(header + scenarios[name].join('\n'))
    trackSwitch.push(Math.round((performance.now() - started) * 10) / 10)
  }
  const switched = await alphaCount(renderer, 1.5)

  renderer.setIsPaused(false, 0.8)
  await sleep(900)
  renderer.setIsPaused(true, 1.5)
  const playback = { qualityLevel: renderer.qualityLevel, errors: window.__errors.length }

  const lifecycle = []
  for (let i = 0; i < 3; i++) {
    const before = performance.now()
    const nextCanvas = document.createElement('canvas')
    document.body.appendChild(nextCanvas)
    const next = await initAssCanvasRenderer(nextCanvas, window.__assUrl, [], (error) => window.__errors.push(`engine:${error?.message || error}`))
    await next.ready
    next.resize(640, 360)
    next.setIsPaused(true, 1)
    await sleep(80)
    lifecycle.push(+(performance.now() - before).toFixed(1))
    disposeAssRenderer(next)
    nextCanvas.remove()
  }
  if (!keep) disposeAssRenderer(renderer)
  return { scenario, width, height, engine: 'jassub', forced: summarize(forced), natural: summarize(natural), adaptive: adaptiveResult, capture, drawDebug, afterEnd, seekBack, resized, scaled, trackSwitch, switched, playback, lifecycle, errors: window.__errors }
}

window.__runBench = () => bench()
window.__phase = 'loaded'
</script>
